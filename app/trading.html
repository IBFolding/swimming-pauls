<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Trading - Swimming Pauls</title>
 <script src="https://cdn.tailwindcss.com"></script>
 <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
 <style>
 @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
 * { font-family: 'Inter', sans-serif; }
 body { background: #0a0a0a; color: #e2e8f0; }
 .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
 .gradient-text { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
 .primary-btn { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%); transition: all 0.3s ease; }
 .trade-row:hover { background: rgba(255, 255, 255, 0.05); }
 .pulse-green { animation: pulse-green 2s infinite; }
 @keyframes pulse-green { 0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); } 50% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); } }
 .trading-subtab { display: none; }
 .trading-subtab:not(.hidden) { display: block; }
 .trading-subtab-btn { transition: all 0.3s ease; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; border: 1px solid rgba(255,255,255,0.1); }
 .trading-subtab-btn.active { background: rgba(34, 211, 238, 0.2); border-color: rgba(34, 211, 238, 0.5); color: #22d3ee; }
 .paper-active { background: rgba(34, 197, 94, 0.2) !important; border-color: rgba(34, 197, 94, 0.5) !important; color: #22c55e !important; }
 .paper-inactive { background: rgba(239, 68, 68, 0.2) !important; border-color: rgba(239, 68, 68, 0.5) !important; color: #ef4444 !important; }
 .paul-card { transition: all 0.3s ease; cursor: pointer; }
 .paul-card:hover { transform: translateY(-2px); border-color: rgba(139, 92, 246, 0.5); }
 .paul-card.selected { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
 .xp-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
 .xp-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 2px; transition: width 0.5s ease; }
 .evolution-badge { animation: glow 2s infinite; }
 @keyframes glow { 0%, 100% { box-shadow: 0 0 5px rgba(139, 92, 246, 0.5); } 50% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.8); } }
 .token-card { transition: all 0.2s ease; }
 .token-card:hover { background: rgba(255,255,255,0.05); }
 /* Mobile menu */
 .mobile-menu { display: none; }
 .mobile-menu.open { display: block; }
 @media (min-width: 768px) { .desktop-nav { display: flex; } .mobile-toggle { display: none; } .mobile-menu { display: none !important; } }
 @media (max-width: 767px) { .desktop-nav { display: none; } .mobile-toggle { display: block; } }
 </style>
</head>
<body class="min-h-screen">
 <!-- Header -->
 <header class="border-b border-white/10 bg-black/90 backdrop-blur-md sticky top-0 z-50">
 <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
 <a href="../index.html" class="flex items-center gap-3">
 <img src="paul.jpg" alt="PAUL" class="w-10 h-10 rounded-full object-cover">
 <span class="font-bold tracking-wider text-sm gradient-text">Swimming Pauls</span>
 </a>
 <nav class="hidden md:flex items-center gap-8 absolute left-1/2 -translate-x-1/2">
 <a href="index.html" class="text-sm text-gray-300 hover:text-white transition-colors">DApp</a>
 <a href="trading.html" class="text-sm text-white font-medium transition-colors">Trading</a>
 <a href="world.html" class="text-sm text-gray-300 hover:text-white transition-colors">World</a>
 <a href="account.html" class="text-sm text-gray-300 hover:text-white transition-colors">Account</a>
 </nav>
 <div class="flex items-center gap-4">
 <div id="credits-display" class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-sm">
 <svg class="w-4 h-4 text-yellow-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
 <span id="credit-balance" class="font-bold text-yellow-400">5</span>
 </div>
 <button id="wallet-btn" onclick="connectWallet()" class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 font-medium transition-colors text-sm">
 <span id="wallet-dot" class="w-2 h-2 rounded-full bg-red-500"></span>
 <span id="wallet-text">Disconnected</span>
 </button>
 <button class="md:hidden p-2 text-white" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
 <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
 </button>
 </div>
 </div>
 <div id="mobile-menu" class="hidden md:hidden border-t border-white/10 bg-black/95 px-6 py-4">
 <div class="flex flex-col gap-3">
 <a href="index.html" class="text-sm px-4 py-3 bg-white/5 hover:bg-white/10 rounded-lg text-gray-300">DApp</a>
 <a href="trading.html" class="text-sm px-4 py-3 bg-white/5 hover:bg-white/10 rounded-lg text-white font-medium">Trading</a>
 <a href="world.html" class="text-sm px-4 py-3 bg-white/5 hover:bg-white/10 rounded-lg text-gray-300">World</a>
 <a href="account.html" class="text-sm px-4 py-3 bg-white/5 hover:bg-white/10 rounded-lg text-gray-300">Account</a>
 <div id="mobile-credits-display" class="hidden flex items-center gap-2 px-4 py-3 rounded-lg bg-white/5 border border-white/10">
 <svg class="w-5 h-5 text-yellow-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
 <span id="mobile-credit-balance" class="font-bold text-yellow-400">5</span>
 <span class="text-sm text-gray-400">credits</span>
 </div>
 <button id="mobile-wallet-btn" onclick="connectWallet()" class="flex items-center justify-center gap-2 px-4 py-3 bg-white/5 hover:bg-white/10 rounded-lg font-medium transition-colors">
 <span id="mobile-wallet-dot" class="w-2 h-2 rounded-full bg-red-500"></span>
 <span id="mobile-wallet-text">Connect Wallet</span>
 </button>
 </div>
 </div>
 </header>
