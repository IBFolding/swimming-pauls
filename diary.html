<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swimming Pauls - Paul's World Diary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0a0a0a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .connected { background: #22c55e; animation: pulse 2s infinite; }
        .disconnected { background: #ef4444; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            width: 100%;
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .timeline-line {
            position: absolute;
            left: 24px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, #3b82f6, #8b5cf6, #ec4899);
        }
        .entry-type-activity { background: #3b82f6; }
        .entry-type-thought { background: #8b5cf6; }
        .entry-type-prediction { background: #22c55e; }
        .entry-type-trade { background: #f59e0b; }
        .entry-type-dream { background: #ec4899; }
        .filter-chip {
            transition: all 0.2s;
            cursor: pointer;
        }
        .filter-chip.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            color: #60a5fa;
        }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <img src="logo.jpg" alt="Swimming Pauls" class="w-10 h-10 rounded-xl object-cover">
                <span class="font-bold tracking-wider text-sm">SWIMMING_PAULS</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-sm text-gray-400">
                    <span id="connectionDot" class="connection-dot disconnected"></span>
                    <span id="connectionStatus">Disconnected</span>
                </div>
                <a href="./" class="text-gray-400 hover:text-white text-sm transition-colors">← Back to Home</a>
            </div>
        </div>

        <!-- Connection Panel -->
        <div class="glass p-6 mb-6">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                    <h3 class="font-semibold mb-1">Connect to Local Server</h3>
                    <p class="text-sm text-gray-500">Enter your connection ID</p>
                </div>
                <div class="flex items-center gap-3">
                    <input type="text" id="connectionId" placeholder="Connection ID" class="input-field w-48">
                    <button onclick="toggleConnection()" class="btn-primary">Connect</button>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div id="filterPanel" class="glass p-6 mb-6" style="display: none;">
            <div class="flex flex-wrap items-center gap-3">
                <span class="text-sm text-gray-400 mr-2">Filter:</span>
                <button class="filter-chip active px-4 py-2 rounded-full border border-white/10 text-sm" data-type="all">All</button>
                <button class="filter-chip px-4 py-2 rounded-full border border-white/10 text-sm" data-type="activity">Activity</button>
                <button class="filter-chip px-4 py-2 rounded-full border border-white/10 text-sm" data-type="thought">Thoughts</button>
                <button class="filter-chip px-4 py-2 rounded-full border border-white/10 text-sm" data-type="prediction">Predictions</button>
                <button class="filter-chip px-4 py-2 rounded-full border border-white/10 text-sm" data-type="trade">Trades</button>
                <button class="filter-chip px-4 py-2 rounded-full border border-white/10 text-sm" data-type="dream">Dreams</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Paul Selector -->
            <div class="lg:col-span-1">
                <div class="glass p-4 sticky top-6">
                    <h3 class="font-semibold mb-4">Pauls</h3>
                    <div id="paulList" class="space-y-2 max-h-96 overflow-y-auto">
                        <p class="text-sm text-gray-500">Connect to see Pauls</p>
                    </div>
                    
                    <div class="mt-6 pt-4 border-t border-white/10">
                        <h4 class="text-sm font-medium text-gray-400 mb-3">Backfill</h4>
                        <button onclick="backfillDreams()" class="w-full py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm text-gray-300 transition-colors mb-2">
                            🌙 Generate Dreams
                        </button>
                        <button onclick="backfillPredictions()" class="w-full py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm text-gray-300 transition-colors">
                            📊 Import Predictions
                        </button>
                    </div>
                </div>
            </div>

            <!-- Timeline -->
            <div class="lg:col-span-3">
                <div id="timelinePanel" class="glass p-6 min-h-96" style="display: none;">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="font-semibold">Timeline</h3>
                        <span id="entryCount" class="text-sm text-gray-400">0 entries</span>
                    </div>
                    
                    <div class="relative pl-8">
                        <div class="timeline-line"></div>
                        <div id="timelineContent" class="space-y-6">
                            <!-- Filled dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-12 text-center text-gray-500 text-sm pb-8">
            <p>Built by Howard | 100% Local | No Cloud</p>
        </footer>
    </div>

    <script>
        let ws = null;
        let isConnected = false;
        let selectedPaul = null;
        let currentFilter = 'all';

        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }

        function connect() {
            const id = document.getElementById('connectionId').value.trim();
            if (!id) {
                alert('Please enter a connection ID');
                return;
            }

            updateConnectionStatus('connecting');

            ws = new WebSocket('ws://localhost:8765');

            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'auth',
                    payload: { connection_id: id }
                }));
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };

            ws.onerror = () => {
                alert('Connection failed');
                updateConnectionStatus('disconnected');
            };

            ws.onclose = () => {
                isConnected = false;
                updateConnectionStatus('disconnected');
                updateUIState();
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
            isConnected = false;
            updateConnectionStatus('disconnected');
            updateUIState();
        }

        function handleMessage(msg) {
            switch (msg.type) {
                case 'auth_success':
                    isConnected = true;
                    updateConnectionStatus('connected');
                    updateUIState();
                    loadDiaryData();
                    break;
                case 'diary.pauls':
                    if (msg.payload && !msg.error) {
                        renderPaulList(msg.payload.pauls || []);
                    }
                    break;
                case 'diary.world':
                    if (msg.payload && !msg.error) {
                        renderTimeline(msg.payload.entries || []);
                    }
                    break;
            }
        }

        function loadDiaryData() {
            if (!ws || !isConnected) return;
            ws.send(JSON.stringify({ type: 'diary.pauls', payload: {} }));
            ws.send(JSON.stringify({ type: 'diary.world', payload: { days: 30 } }));
        }

        function renderPaulList(pauls) {
            const container = document.getElementById('paulList');
            container.innerHTML = pauls.length === 0 
                ? '<p class="text-sm text-gray-500">No Pauls with entries</p>'
                : pauls.map(p => `
                    <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 cursor-pointer ${selectedPaul === p.paul_id ? 'bg-white/10' : ''}" onclick="selectPaul('${p.paul_id}')">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-sm font-bold">${p.paul_name.charAt(0)}</div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium truncate">${p.paul_name}</p>
                            <p class="text-xs text-gray-500">${p.entry_count} entries</p>
                        </div>
                    </div>
                `).join('');
        }

        function selectPaul(paulId) {
            selectedPaul = paulId;
            renderPaulList([]);
            if (ws && isConnected) {
                ws.send(JSON.stringify({ type: 'diary.get', payload: { paul_id: paulId, limit: 50 } }));
            }
        }

        function renderTimeline(entries) {
            const filtered = currentFilter === 'all' ? entries : entries.filter(e => e.entry_type === currentFilter);
            document.getElementById('entryCount').textContent = `${filtered.length} entries`;
            
            const container = document.getElementById('timelineContent');
            container.innerHTML = filtered.length === 0 
                ? '<p class="text-gray-500 text-center py-12">No entries</p>'
                : filtered.map(entry => `
                    <div class="relative">
                        <div class="w-3 h-3 rounded-full absolute left-[-21px] top-1 entry-type-${entry.entry_type}"></div>
                        <div class="glass p-4">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-xs px-2 py-1 rounded-full bg-white/10 text-gray-300 uppercase">${entry.entry_type}</span>
                                <span class="text-sm text-gray-400">${new Date(entry.timestamp).toLocaleString()}</span>
                            </div>
                            <p class="text-white">${entry.content}</p>
                        </div>
                    </div>
                `).join('');
        }

        function backfillDreams() {
            if (!ws || !isConnected) return;
            ws.send(JSON.stringify({ type: 'diary.backfill', payload: { operation: 'dreams', days: 30 } }));
        }

        function backfillPredictions() {
            if (!ws || !isConnected) return;
            ws.send(JSON.stringify({ type: 'diary.backfill', payload: { operation: 'predictions' } }));
        }

        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.dataset.type;
                loadDiaryData();
            });
        });

        function updateConnectionStatus(status) {
            const dot = document.getElementById('connectionDot');
            const text = document.getElementById('connectionStatus');
            dot.className = 'connection-dot ' + status;
            text.textContent = status === 'connected' ? 'Connected' : status === 'connecting' ? 'Connecting...' : 'Disconnected';
        }

        function updateUIState() {
            const filterPanel = document.getElementById('filterPanel');
            const timelinePanel = document.getElementById('timelinePanel');
            if (isConnected) {
                filterPanel.style.display = 'block';
                timelinePanel.style.display = 'block';
            } else {
                filterPanel.style.display = 'none';
                timelinePanel.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUIState();
        });
    </script>
</body>
</html>
